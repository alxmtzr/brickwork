    <circle cx="438" cy="54" r="4.2"/><circle cx="447" cy="54" r="4.2"/><circle cx="456" cy="54" r="4.2"/>
    <circle cx="438" cy="64" r="4.2"/><circle cx="465" cy="64" r="4.2"/>
    <circle cx="438" cy="74" r="4.2"/><circle cx="447" cy="74" r="4.2"/><circle cx="456" cy="74" r="4.2"/>
    <circle cx="438" cy="84" r="4.2"/><circle cx="456" cy="84" r="4.2"/>
    <circle cx="438" cy="94" r="4.2"/><circle cx="465" cy="94" r="4.2"/>
