  <g fill="url(#silverBall)">
    <!-- B -->
    <circle cx="118" cy="54" r="4.2"/><circle cx="127" cy="54" r="4.2"/><circle cx="136" cy="54" r="4.2"/>
    <circle cx="118" cy="64" r="4.2"/><circle cx="145" cy="64" r="4.2"/>
    <circle cx="118" cy="74" r="4.2"/><circle cx="127" cy="74" r="4.2"/><circle cx="136" cy="74" r="4.2"/>
    <circle cx="118" cy="84" r="4.2"/><circle cx="145" cy="84" r="4.2"/>
    <circle cx="118" cy="94" r="4.2"/><circle cx="127" cy="94" r="4.2"/><circle cx="136" cy="94" r="4.2"/>
    <!-- R -->
    <circle cx="164" cy="54" r="4.2"/><circle cx="173" cy="54" r="4.2"/><circle cx="182" cy="54" r="4.2"/>
    <circle cx="164" cy="64" r="4.2"/><circle cx="191" cy="64" r="4.2"/>
    <circle cx="164" cy="74" r="4.2"/><circle cx="173" cy="74" r="4.2"/><circle cx="182" cy="74" r="4.2"/>
    <circle cx="164" cy="84" r="4.2"/><circle cx="182" cy="84" r="4.2"/>
    <circle cx="164" cy="94" r="4.2"/><circle cx="191" cy="94" r="4.2"/>
    <!-- I -->
    <circle cx="210" cy="54" r="4.2"/><circle cx="219" cy="54" r="4.2"/><circle cx="228" cy="54" r="4.2"/>
    <circle cx="219" cy="64" r="4.2"/><circle cx="219" cy="74" r="4.2"/><circle cx="219" cy="84" r="4.2"/>
    <circle cx="210" cy="94" r="4.2"/><circle cx="219" cy="94" r="4.2"/><circle cx="228" cy="94" r="4.2"/>
    <!-- C -->
    <circle cx="255" cy="54" r="4.2"/><circle cx="264" cy="54" r="4.2"/><circle cx="273" cy="54" r="4.2"/>
    <circle cx="246" cy="64" r="4.2"/><circle cx="246" cy="74" r="4.2"/><circle cx="246" cy="84" r="4.2"/>
    <circle cx="255" cy="94" r="4.2"/><circle cx="264" cy="94" r="4.2"/><circle cx="273" cy="94" r="4.2"/>
    <!-- K -->
    <circle cx="292" cy="54" r="4.2"/><circle cx="319" cy="54" r="4.2"/>
    <circle cx="292" cy="64" r="4.2"/><circle cx="310" cy="64" r="4.2"/>
    <circle cx="292" cy="74" r="4.2"/><circle cx="301" cy="74" r="4.2"/>
    <circle cx="292" cy="84" r="4.2"/><circle cx="310" cy="84" r="4.2"/>
    <circle cx="292" cy="94" r="4.2"/><circle cx="319" cy="94" r="4.2"/>
    <!-- W -->
    <circle cx="338" cy="54" r="4.2"/><circle cx="374" cy="54" r="4.2"/>
    <circle cx="338" cy="64" r="4.2"/><circle cx="374" cy="64" r="4.2"/>
    <circle cx="338" cy="74" r="4.2"/><circle cx="356" cy="74" r="4.2"/><circle cx="374" cy="74" r="4.2"/>
    <circle cx="338" cy="84" r="4.2"/><circle cx="347" cy="84" r="4.2"/><circle cx="365" cy="84" r="4.2"/><circle cx="374" cy="84" r="4.2"/>
    <circle cx="338" cy="94" r="4.2"/><circle cx="374" cy="94" r="4.2"/>
    <!-- O -->
    <circle cx="401" cy="54" r="4.2"/><circle cx="410" cy="54" r="4.2"/>
    <circle cx="392" cy="64" r="4.2"/><circle cx="419" cy="64" r="4.2"/>
    <circle cx="392" cy="74" r="4.2"/><circle cx="419" cy="74" r="4.2"/>
    <circle cx="392" cy="84" r="4.2"/><circle cx="419" cy="84" r="4.2"/>
    <circle cx="401" cy="94" r="4.2"/><circle cx="410" cy="94" r="4.2"/>
