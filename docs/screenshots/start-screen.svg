<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%">
  <defs>
    <radialGradient id="spot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#a0b0c0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="silverBall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#b8c4d0"/>
      <stop offset="100%" stop-color="#2c3440"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffff66"/>
      <stop offset="50%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#aa4400"/>
    </linearGradient>
    <linearGradient id="btnActive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#103458"/>
      <stop offset="100%" stop-color="#06182c"/>
    </linearGradient>
    <linearGradient id="btnIdle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182230"/>
      <stop offset="100%" stop-color="#0c121a"/>
    </linearGradient>
  </defs>

  <!-- Black Background -->
  <rect width="640" height="480" fill="#000000"/>

  <!-- Top Status Bar -->
  <text x="10" y="22" fill="#d8e0f0" font-family="'Courier New', monospace" font-weight="bold" font-size="13">Last Score - 18450</text>
  <text x="630" y="22" fill="#d8e0f0" font-family="'Courier New', monospace" font-weight="bold" font-size="13" text-anchor="end">V 1.0</text>

  <!-- Left & Right Spotlights -->
  <circle cx="100" cy="75" r="56" fill="url(#spot)"/>
  <circle cx="540" cy="75" r="56" fill="url(#spot)"/>

  <!-- Cyan Framed Top Box -->
  <rect x="100" y="35" width="440" height="80" fill="#000000" stroke="#00b8b8" stroke-width="5"/>
  <rect x="98.5" y="33.5" width="443" height="83" fill="none" stroke="#40ffff" stroke-width="1.5"/>

  <!-- Background Orbiting Cyan Dots -->
