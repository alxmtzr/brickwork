    <circle cx="484" cy="54" r="4.2"/><circle cx="511" cy="54" r="4.2"/>
    <circle cx="484" cy="64" r="4.2"/><circle cx="502" cy="64" r="4.2"/>
    <circle cx="484" cy="74" r="4.2"/><circle cx="493" cy="74" r="4.2"/>
    <circle cx="484" cy="84" r="4.2"/><circle cx="502" cy="84" r="4.2"/>
    <circle cx="484" cy="94" r="4.2"/><circle cx="511" cy="94" r="4.2"/>
