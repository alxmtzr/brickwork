    <circle cx="114" cy="105" r="1.2"/><circle cx="134" cy="105" r="1.2"/><circle cx="154" cy="105" r="1.2"/><circle cx="174" cy="105" r="1.2"/><circle cx="194" cy="105" r="1.2"/><circle cx="214" cy="105" r="1.2"/><circle cx="234" cy="105" r="1.2"/><circle cx="254" cy="105" r="1.2"/><circle cx="274" cy="105" r="1.2"/><circle cx="294" cy="105" r="1.2"/><circle cx="314" cy="105" r="1.2"/><circle cx="334" cy="105" r="1.2"/><circle cx="354" cy="105" r="1.2"/><circle cx="374" cy="105" r="1.2"/><circle cx="394" cy="105" r="1.2"/><circle cx="414" cy="105" r="1.2"/><circle cx="434" cy="105" r="1.2"/><circle cx="454" cy="105" r="1.2"/><circle cx="474" cy="105" r="1.2"/><circle cx="494" cy="105" r="1.2"/><circle cx="514" cy="105" r="1.2"/>
  </g>

