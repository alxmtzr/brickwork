<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%">
  <defs>
    <linearGradient id="borderL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d8d8ec"/>
      <stop offset="55%" stop-color="#8888a4"/>
      <stop offset="100%" stop-color="#303040"/>
    </linearGradient>
    <linearGradient id="borderR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#303040"/>
      <stop offset="45%" stop-color="#8888a4"/>
      <stop offset="100%" stop-color="#d8d8ec"/>
    </linearGradient>
    <linearGradient id="playBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00aa55"/>
      <stop offset="100%" stop-color="#005522"/>
    </linearGradient>
  </defs>

  <rect width="640" height="480" fill="#000000"/>
  <rect x="0" y="0" width="20" height="480" fill="url(#borderL)"/>
  <rect x="620" y="0" width="20" height="480" fill="url(#borderR)"/>

  <!-- Top Editor Action Bar -->
  <rect x="24" y="6" width="70" height="30" rx="6" fill="#141e2d" stroke="#557799" stroke-width="1"/>
  <text x="59" y="25" fill="#ccddee" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">✕ Back</text>

  <rect x="430" y="6" width="60" height="30" rx="6" fill="#281419" stroke="#ff4466" stroke-width="1"/>
  <text x="460" y="25" fill="#ff6688" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">🗑 Clear</text>

  <rect x="500" y="6" width="116" height="30" rx="6" fill="url(#playBtn)" stroke="#00ff88" stroke-width="2"/>
  <text x="558" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" text-anchor="middle">▶ PLAY LEVEL</text>

  <!-- 20x20 Grid with Custom Drawn Bricks -->
  <g transform="translate(20, 55)">
    <!-- Grid Lines -->
    <g stroke="#1b2432" stroke-width="1" fill="none">
      <rect x="0" y="0" width="600" height="300"/>
      <line x1="0" y1="30" x2="600" y2="30"/><line x1="0" y1="60" x2="600" y2="60"/><line x1="0" y1="90" x2="600" y2="90"/><line x1="0" y1="120" x2="600" y2="120"/><line x1="0" y1="150" x2="600" y2="150"/><line x1="0" y1="180" x2="600" y2="180"/><line x1="0" y1="210" x2="600" y2="210"/><line x1="0" y1="240" x2="600" y2="240"/><line x1="0" y1="270" x2="600" y2="270"/>
      <line x1="60" y1="0" x2="60" y2="300"/><line x1="120" y1="0" x2="120" y2="300"/><line x1="180" y1="0" x2="180" y2="300"/><line x1="240" y1="0" x2="240" y2="300"/><line x1="300" y1="0" x2="300" y2="300"/><line x1="360" y1="0" x2="360" y2="300"/><line x1="420" y1="0" x2="420" y2="300"/><line x1="480" y1="0" x2="480" y2="300"/><line x1="540" y1="0" x2="540" y2="300"/>
    </g>

    <!-- Custom Painted Fortress Pattern -->
    <g fill="#00b8b8" stroke="#60ffff" stroke-width="1">
      <rect x="120" y="30" width="30" height="15"/><rect x="150" y="30" width="30" height="15"/><rect x="180" y="30" width="30" height="15"/><rect x="390" y="30" width="30" height="15"/><rect x="420" y="30" width="30" height="15"/><rect x="450" y="30" width="30" height="15"/>
    </g>
    <g fill="#ff8800" stroke="#ffff44" stroke-width="1.5">
      <rect x="210" y="45" width="30" height="15"/><rect x="240" y="45" width="30" height="15"/><rect x="270" y="45" width="30" height="15"/><rect x="300" y="45" width="30" height="15"/><rect x="330" y="45" width="30" height="15"/><rect x="360" y="45" width="30" height="15"/>
    </g>
    <g fill="#d85888" stroke="#ffa0c0" stroke-width="1">
      <rect x="150" y="60" width="30" height="15"/><rect x="180" y="60" width="30" height="15"/><rect x="210" y="60" width="30" height="15"/><rect x="360" y="60" width="30" height="15"/><rect x="390" y="60" width="30" height="15"/><rect x="420" y="60" width="30" height="15"/>
    </g>
    <g fill="#00b818" stroke="#58ff68" stroke-width="1">
      <rect x="180" y="75" width="30" height="15"/><rect x="210" y="75" width="30" height="15"/><rect x="240" y="75" width="30" height="15"/><rect x="270" y="75" width="30" height="15"/><rect x="300" y="75" width="30" height="15"/><rect x="330" y="75" width="30" height="15"/><rect x="360" y="75" width="30" height="15"/><rect x="390" y="75" width="30" height="15"/>
    </g>
  </g>

  <!-- Bottom 22-Brick Palette Swatch Bar -->
  <rect x="20" y="428" width="600" height="44" fill="#0e141f" stroke="#0088cc" stroke-width="1"/>
  <rect x="26" y="436" width="38" height="28" rx="4" fill="#1a1a24" stroke="#445566" stroke-width="1"/>
  <text x="45" y="454" fill="#ff6666" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" text-anchor="middle">ERASE</text>

  <!-- Brick Color Swatches -->
  <g transform="translate(70, 437)">
    <rect x="0" y="0" width="20" height="26" fill="#cc1010"/><rect x="24" y="0" width="20" height="26" fill="#787888"/><rect x="48" y="0" width="20" height="26" fill="#b0b0b8"/><rect x="72" y="0" width="20" height="26" fill="#888890"/><rect x="96" y="0" width="20" height="26" fill="#606068"/><rect x="120" y="0" width="20" height="26" fill="#d85888"/><rect x="144" y="0" width="20" height="26" fill="#f08820"/><rect x="168" y="0" width="20" height="26" fill="#ff8800" stroke="#ffffff" stroke-width="2"/><rect x="192" y="0" width="20" height="26" fill="#00b818"/><rect x="216" y="0" width="20" height="26" fill="#0028c8"/><rect x="240" y="0" width="20" height="26" fill="#6818a8"/><rect x="264" y="0" width="20" height="26" fill="#00b8b8"/><rect x="288" y="0" width="20" height="26" fill="#d86800"/><rect x="312" y="0" width="20" height="26" fill="#c81058"/><rect x="336" y="0" width="20" height="26" fill="#d86898"/><rect x="360" y="0" width="20" height="26" fill="#c818c8"/><rect x="384" y="0" width="20" height="26" fill="#009070"/><rect x="408" y="0" width="20" height="26" fill="#808080"/><rect x="432" y="0" width="20" height="26" fill="#606060"/><rect x="456" y="0" width="20" height="26" fill="#b89000"/><rect x="480" y="0" width="20" height="26" fill="#20a8d8"/><rect x="504" y="0" width="20" height="26" fill="#e8d800"/>
  </g>
</svg>
