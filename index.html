<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Brickwork" />
    <meta name="theme-color" content="#060810" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <title>Brickwork</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100dvh;
        background: #060810;
        color: #ddd;
        font: 14px/1.4 system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
      }
      #game-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        touch-action: none;
      }
      #stage {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        cursor: crosshair;
        background: #000;
      }
      body.classic-mode #stage {
        width: auto;
        height: auto;
        max-width: 640px;
        max-height: 480px;
        aspect-ratio: 4 / 3;
        border: 2px solid #2a3d55;
        border-radius: 4px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 8px rgba(0, 224, 255, 0.2);
      }
      #top-nav {
        position: absolute;
        top: max(8px, env(safe-area-inset-top));
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
        pointer-events: none;
        z-index: 10;
      }
      #top-nav > * {
        pointer-events: auto;
      }
      .nav-group {
        display: flex;
        gap: 6px;
      }
      button {
        background: rgba(18, 28, 42, 0.85);
        backdrop-filter: blur(8px);
        color: #00e0ff;
        border: 1px solid rgba(0, 224, 255, 0.3);
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 11px;
        font-weight: bold;
        cursor: pointer;
        touch-action: manipulation;
        transition: background 0.15s, border-color 0.15s;
      }
      button:active, button:hover {
        background: rgba(30, 48, 70, 0.95);
        border-color: #00e0ff;
      }
      #mode-toggle {
        color: #ffaa00;
        border-color: rgba(255, 170, 0, 0.4);
      }
      /* Fullscreen & PWA helper modal */
      #fs-modal {
        display: none;
        position: absolute;
        bottom: max(20px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        width: min(90%, 380px);
        background: rgba(14, 22, 36, 0.96);
        border: 1px solid #00e0ff;
        border-radius: 12px;
        padding: 14px 18px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 224, 255, 0.3);
        z-index: 100;
        text-align: center;
        font-size: 13px;
        line-height: 1.5;
        color: #eee;
      }
      #fs-modal .title {
        font-weight: bold;
        color: #00e0ff;
        margin-bottom: 6px;
        font-size: 14px;
      }
      #fs-modal .content {
        text-align: left;
        margin: 8px 0;
        font-size: 12px;
      }
      #fs-modal button.close-btn {
        margin-top: 6px;
        background: #00e0ff;
        color: #060810;
        border: none;
        padding: 6px 18px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <div id="top-nav">
        <div class="nav-group">
          <button id="btn-home">🏠 Menu</button>
          <button id="mode-toggle">Switch Mode</button>
        </div>
        <div class="nav-group">
          <button id="btn-editor">Editor</button>
          <button id="btn-play-custom" style="display: none; background: rgba(0, 180, 80, 0.9); border-color: #00ff88; color: #fff;">▶ Play Level</button>
          <button id="btn-scores">Scores</button>
          <button id="fs-btn">⛶ Fullscreen</button>
        </div>
      </div>

      <canvas id="stage"></canvas>

      <div id="fs-modal">
        <div class="title">Play in Fullscreen</div>
        <div class="content" id="fs-modal-body"></div>
        <button class="close-btn" id="close-fs-modal">Got it!</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
